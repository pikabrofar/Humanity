<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-labelledby="t d">
  <title id="t">How Humanity works</title>
  <desc id="d">Camera and microphone feed Apple's on-device Vision and Speech frameworks on your Mac, which drive the pointer, clicks and typing. Nothing is uploaded; cloud AI is optional with your own key.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0b14"/><stop offset="1" stop-color="#140f26"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7cc4ff"/><stop offset=".5" stop-color="#c79bff"/><stop offset="1" stop-color="#ffb37a"/></linearGradient>
    <clipPath id="card"><rect width="1280" height="300" rx="24"/></clipPath>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .flow { stroke-dasharray: 6 14; animation: flow 1.2s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -20; } }
      .dot { animation: travel 3.2s cubic-bezier(.5,0,.5,1) infinite; }
      .dot2 { animation-delay: 1.6s; }
      @keyframes travel { 0% { transform: translateX(0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateX(760px); opacity: 0; } }
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: .5; } 50% { transform: scale(1.12); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="300" fill="url(#bg)"/>
    <!-- Mac boundary -->
    <rect x="300" y="40" width="680" height="200" rx="22" fill="#ffffff" fill-opacity=".03" stroke="#ffffff" stroke-opacity=".14" stroke-dasharray="4 6"/>
    <text x="640" y="268" text-anchor="middle" font-size="15" fill="#8f8aa8" letter-spacing="2">EVERYTHING INSIDE THIS BOX STAYS ON YOUR MAC</text>

    <!-- line -->
    <path d="M190 140 H1090" stroke="url(#line)" stroke-width="3" stroke-opacity=".35"/>
    <path class="flow" d="M190 140 H1090" stroke="url(#line)" stroke-width="3"/>
    <circle class="dot" cx="250" cy="140" r="6" fill="#ffffff"/>
    <circle class="dot dot2" cx="250" cy="140" r="6" fill="#ffffff"/>

    <!-- inputs -->
    <g transform="translate(110 140)">
      <circle r="52" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".16"/>
      <rect x="-22" y="-14" width="30" height="28" rx="6" fill="none" stroke="#7cc4ff" stroke-width="3"/>
      <path d="M8 -6 L22 -14 V14 L8 6 Z" fill="none" stroke="#7cc4ff" stroke-width="3" stroke-linejoin="round"/>
      <text y="84" text-anchor="middle" font-size="17" font-weight="600" fill="#ece9f7">Camera + mic</text>
    </g>

    <!-- on-device stages -->
    <g transform="translate(440 140)">
      <rect x="-100" y="-48" width="200" height="96" rx="18" fill="#1d1a30" stroke="#7cc4ff" stroke-opacity=".5"/>
      <text y="-8" text-anchor="middle" font-size="19" font-weight="700" fill="#f3f1fb">Apple Vision</text>
      <text y="18" text-anchor="middle" font-size="14" fill="#a9a5c2">face · eyes · hands</text>
    </g>
    <g transform="translate(640 140)">
      <rect x="-90" y="-48" width="180" height="96" rx="18" fill="#1d1a30" stroke="#c79bff" stroke-opacity=".5"/>
      <text y="-8" text-anchor="middle" font-size="19" font-weight="700" fill="#f3f1fb">Speech</text>
      <text y="18" text-anchor="middle" font-size="14" fill="#a9a5c2">on-device recognizer</text>
    </g>
    <g transform="translate(840 140)">
      <rect x="-100" y="-48" width="200" height="96" rx="18" fill="#1d1a30" stroke="#ffb37a" stroke-opacity=".5"/>
      <text y="-8" text-anchor="middle" font-size="19" font-weight="700" fill="#f3f1fb">Your Mac</text>
      <text y="18" text-anchor="middle" font-size="14" fill="#a9a5c2">pointer · clicks · text</text>
    </g>

    <!-- cloud (optional) -->
    <g transform="translate(1170 140)">
      <circle class="pulse" r="52" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-dasharray="3 5"/>
      <path d="M-24 10 a14 14 0 0 1 4 -27 a18 18 0 0 1 34 2 a12 12 0 0 1 4 25 z" fill="none" stroke="#8f8aa8" stroke-width="3" stroke-linejoin="round"/>
      <text y="84" text-anchor="middle" font-size="17" font-weight="600" fill="#ece9f7">Cloud AI</text>
      <text y="106" text-anchor="middle" font-size="13" fill="#8f8aa8">optional · your key · text only</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="1279" height="299" rx="24" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
</svg>
