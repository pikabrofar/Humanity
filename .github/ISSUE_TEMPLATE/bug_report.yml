name: Bug report
description: Something in sentidoS, ojoS, manoS or bocaS doesn't work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please search [existing issues](https://github.com/pikabrofar/sentidoS/issues) first.

        **Security problem?** Don't open a public issue. Follow [SECURITY.md](https://github.com/pikabrofar/sentidoS/blob/main/SECURITY.md) instead.

  - type: dropdown
    id: module
    attributes:
      label: Module
      description: Which part of the suite is affected?
      multiple: true
      options:
        - sentidoS (menu bar app, setup, permissions)
        - ojoS (eye tracking)
        - manoS (hand gestures)
        - bocaS dictation or notes
        - bocaS meetings
        - AI providers (bring your own key)
        - Build from source / packaging
        - Not sure
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      description: Apple menu > About This Mac.
      placeholder: "macOS 26.0 (25A354)"
    validations:
      required: true

  - type: input
    id: mac
    attributes:
      label: Mac model
      description: sentidoS needs Apple silicon. Include the chip and, for ojoS or manoS, the camera you use.
      placeholder: "MacBook Air M2, built-in camera"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      description: From the About window, or the commit hash if you built from source.
      placeholder: "1.0.0, standalone ojoS"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Turn on manoS from the menu bar panel
        2. Pinch thumb and index finger
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Relevant lines from Console.app (filter by the app name) or crash reports from ~/Library/Logs/DiagnosticReports. Remove anything personal, such as transcript text or file paths with names.
      render: text

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      description: Issues are public.
      options:
        - label: I have not attached camera images, screenshots of video frames, audio, transcripts or recordings of other people, and I removed personal data from logs.
          required: true
