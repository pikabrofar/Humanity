name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        app: [Ojos, Manos, Bocas, AIKit, MeetingKit, Sentidos]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build and test ${{ matrix.app }}
        working-directory: ${{ matrix.app }}
        run: |
          swift build
          if [ -d Tests ]; then swift test; fi
