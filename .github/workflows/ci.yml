name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visiongaze:
    # macos-14 images are retired on 2026-11-02.
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: VisionGaze
    steps:
      - uses: actions/checkout@v4
      # No .build cache: its module cache embeds absolute paths and the compiler
      # version, so a restored cache breaks after a repo rename or Xcode update,
      # and a clean build takes under a minute anyway.
      - run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: make test
      # Renders every screen with canned data (no camera) so UI changes can be
      # reviewed from the uploaded artifact. Never fails the build.
      - name: UI screenshots
        continue-on-error: true
        run: |
          out="$RUNNER_TEMP/screenshots"
          mkdir -p "$out"
          VISIONGAZE_SHOWCASE="$out" .build/debug/VisionGaze &
          pid=$!
          for _ in $(seq 1 120); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          kill "$pid" 2>/dev/null || true
          swift scripts/make-icon.swift "$out/icon.iconset"
          ls -la "$out"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
          retention-days: 14
